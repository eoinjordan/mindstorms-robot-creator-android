<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Robot Blocks</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #10202b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      min-height: 56px;
      flex-shrink: 0;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      min-height: 44px;
    }
    #runBtn { background: #16a34a; }
    #clearBtn { background: #475569; }
    #statusMsg {
      flex: 1;
      min-width: 0;
      color: #cbd5e1;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #content {
      display: grid;
      grid-template-columns: 42% 58%;
      min-height: 0;
      flex: 1;
    }
    #palette, #programPane {
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
    }
    #palette { background: #132434; border-right: 1px solid #334155; }
    #programPane { background: #0f1c28; }
    .sectionTitle {
      margin: 2px 0 8px;
      color: #93c5fd;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .block {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 12px;
      border-radius: 8px;
      text-align: left;
      box-shadow: 0 2px 0 rgba(0,0,0,.25);
      touch-action: manipulation;
    }
    .block.light { background: #0284c7; }
    .block.move { background: #059669; }
    .block.wait { background: #7c3aed; }
    .block.sound { background: #db2777; }
    .block.control { background: #ea580c; }
    .programBlock {
      position: relative;
      margin: 0 0 8px;
      padding: 12px 44px 12px 12px;
      border-radius: 8px;
      background: #1e293b;
      border-left: 6px solid #38bdf8;
      color: #f8fafc;
    }
    .programBlock.move { border-left-color: #34d399; }
    .programBlock.wait { border-left-color: #a78bfa; }
    .programBlock.sound { border-left-color: #f472b6; }
    .programBlock.control { border-left-color: #fb923c; }
    .remove {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 32px;
      min-height: 32px;
      padding: 0;
      background: #334155;
      border-radius: 6px;
    }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    select, input {
      min-height: 36px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #0f172a;
      color: #f8fafc;
      padding: 6px;
      font-size: 15px;
    }
    input[type="number"] { width: 72px; }
    #emptyState {
      padding: 18px;
      border: 2px dashed #475569;
      border-radius: 8px;
      color: #cbd5e1;
      line-height: 1.35;
    }
    #codePreview {
      width: 100%;
      min-height: 150px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #020617;
      color: #86efac;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    body.kids #toolbar {
      background: #1d4ed8;
      min-height: 72px;
      padding: 10px;
    }
    body.kids button {
      border-radius: 14px;
      min-height: 54px;
      font-size: 18px;
    }
    body.kids #runBtn { background: #22c55e; box-shadow: 0 4px 0 #15803d; }
    body.kids #clearBtn { background: #f97316; box-shadow: 0 4px 0 #c2410c; }
    body.kids #statusMsg { color: #dbeafe; font-size: 15px; font-weight: 700; }
    body.kids #content { grid-template-columns: 100%; grid-template-rows: auto 1fr; }
    body.kids #palette {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-right: 0;
      border-bottom: 1px solid #334155;
      overflow-y: visible;
    }
    body.kids .sectionTitle { grid-column: 1 / -1; font-size: 14px; margin-bottom: 0; }
    body.kids .block { margin: 0; min-height: 58px; font-size: 18px; border-radius: 14px; }
    body.kids .programBlock { font-size: 18px; border-radius: 14px; padding-top: 14px; padding-bottom: 14px; }
    body.kids #codePreview { display: none; }
    @media (max-width: 640px) {
      #content { grid-template-columns: 100%; grid-template-rows: auto 1fr; }
      #palette {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        border-right: 0;
        border-bottom: 1px solid #334155;
        max-height: 40vh;
      }
      .sectionTitle { grid-column: 1 / -1; }
      .block { margin: 0; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button id="runBtn">Run</button>
    <button id="clearBtn">Clear</button>
    <span id="statusMsg">Add blocks, then run or export.</span>
  </div>
  <div id="content">
    <div id="palette">
      <div class="sectionTitle">Blocks</div>
      <button class="block light" data-kind="light">Hub light</button>
      <button class="block move" data-kind="motor">Motor run</button>
      <button class="block move" data-kind="pair">Drive pair</button>
      <button class="block wait" data-kind="wait">Wait</button>
      <button class="block sound" data-kind="beep">Beep</button>
      <button class="block move" data-kind="stop">Stop motors</button>
      <button class="block control" data-kind="repeat">Repeat 3 times</button>
    </div>
    <div id="programPane">
      <div class="sectionTitle">Program</div>
      <div id="program"></div>
      <pre id="codePreview"></pre>
    </div>
  </div>
</div>

<script>
const KIDS = new URLSearchParams(location.search).get("kids") === "1";
if (KIDS) {
  document.body.classList.add("kids");
  document.getElementById("runBtn").textContent = "Make WeDo Code";
  document.getElementById("statusMsg").textContent = "Tap blocks to build a WeDo program.";
}

const program = [];
const presets = {
  light: { label: "Hub light", group: "light", color: "green" },
  motor: { label: "Motor run", group: "move", port: "A", speed: 35, seconds: 1 },
  pair: { label: "Drive pair", group: "move", left: "A", right: "B", speed: 35, seconds: 1 },
  wait: { label: "Wait", group: "wait", seconds: 1 },
  beep: { label: "Beep", group: "sound", freq: 440, seconds: 0.3 },
  stop: { label: "Stop motors", group: "move", ports: "AB" },
  repeat: { label: "Repeat 3 times", group: "control", times: 3 }
};

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function addBlock(kind) {
  const block = clone(presets[kind]);
  block.kind = kind;
  program.push(block);
  render();
}

function removeBlock(index) {
  program.splice(index, 1);
  render();
}

function updateBlock(index, key, value) {
  const numeric = ["speed", "seconds", "freq", "times"].includes(key);
  program[index][key] = numeric ? Number(value) : value;
  render();
}

function portsOptions(selected, allowF) {
  const ports = allowF ? ["A","B","C","D","E","F"] : ["A","B"];
  return ports.map(p => `<option value="${p}" ${p === selected ? "selected" : ""}>${p}</option>`).join("");
}

function renderBlock(block, index) {
  let controls = "";
  if (block.kind === "light") {
    controls = `<select onchange="updateBlock(${index}, 'color', this.value)">
      ${["green","red","orange","blue","cyan","magenta","yellow","white"].map(c => `<option value="${c}" ${block.color === c ? "selected" : ""}>${c}</option>`).join("")}
    </select>`;
  } else if (block.kind === "motor") {
    controls = `motor <select onchange="updateBlock(${index}, 'port', this.value)">${portsOptions(block.port, !KIDS)}</select>
      speed <input type="number" min="-50" max="50" value="${block.speed}" onchange="updateBlock(${index}, 'speed', this.value)">
      sec <input type="number" min="0.1" max="2" step="0.1" value="${block.seconds}" onchange="updateBlock(${index}, 'seconds', this.value)">`;
  } else if (block.kind === "pair") {
    controls = `left <select onchange="updateBlock(${index}, 'left', this.value)">${portsOptions(block.left, !KIDS)}</select>
      right <select onchange="updateBlock(${index}, 'right', this.value)">${portsOptions(block.right, !KIDS)}</select>
      speed <input type="number" min="-50" max="50" value="${block.speed}" onchange="updateBlock(${index}, 'speed', this.value)">
      sec <input type="number" min="0.1" max="2" step="0.1" value="${block.seconds}" onchange="updateBlock(${index}, 'seconds', this.value)">`;
  } else if (block.kind === "wait") {
    controls = `seconds <input type="number" min="0.1" max="5" step="0.1" value="${block.seconds}" onchange="updateBlock(${index}, 'seconds', this.value)">`;
  } else if (block.kind === "beep") {
    controls = `freq <input type="number" min="120" max="2000" value="${block.freq}" onchange="updateBlock(${index}, 'freq', this.value)">
      sec <input type="number" min="0.1" max="1" step="0.1" value="${block.seconds}" onchange="updateBlock(${index}, 'seconds', this.value)">`;
  } else if (block.kind === "stop") {
    controls = "stop A and B";
  } else if (block.kind === "repeat") {
    controls = `repeat previous safe move <input type="number" min="2" max="6" value="${block.times}" onchange="updateBlock(${index}, 'times', this.value)"> times`;
  }
  return `<div class="programBlock ${block.group}">
    <strong>${block.label}</strong>
    <div class="row">${controls}</div>
    <button class="remove" onclick="removeBlock(${index})">x</button>
  </div>`;
}

function render() {
  const root = document.getElementById("program");
  if (!program.length) {
    root.innerHTML = `<div id="emptyState">Tap a block on the left to start. In kid mode, use WeDo ports A and B and keep the robot clear.</div>`;
  } else {
    root.innerHTML = program.map(renderBlock).join("");
  }
  document.getElementById("codePreview").textContent = generatePython();
  if (window.AndroidBridge && window.AndroidBridge.onCodeChanged) {
    window.AndroidBridge.onCodeChanged(generatePython());
  }
}

function clamp(value, low, high) {
  const n = Number(value);
  if (Number.isNaN(n)) return low;
  return Math.max(low, Math.min(high, n));
}

function colorId(color) {
  return { blue: 3, cyan: 4, magenta: 5, green: 6, orange: 7, yellow: 8, red: 9, white: 10 }[color] || 6;
}

function lineFor(block) {
  if (block.kind === "light") return `hub.led(${colorId(block.color)})`;
  if (block.kind === "motor") {
    const p = block.port.toLowerCase();
    return [
      `motor_${p}.start(speed=${clamp(block.speed, -50, 50)})`,
      `time.sleep(${clamp(block.seconds, 0.1, 2)})`,
      `motor_${p}.stop()`
    ].join("\n");
  }
  if (block.kind === "pair") {
    const l = block.left.toLowerCase();
    const r = block.right.toLowerCase();
    return [
      `motor_${l}.start(speed=${clamp(block.speed, -50, 50)})`,
      `motor_${r}.start(speed=${clamp(block.speed, -50, 50)})`,
      `time.sleep(${clamp(block.seconds, 0.1, 2)})`,
      `motor_${l}.stop()`,
      `motor_${r}.stop()`
    ].join("\n");
  }
  if (block.kind === "wait") return `time.sleep(${clamp(block.seconds, 0.1, 5)})`;
  if (block.kind === "beep") return `# Beep ${clamp(block.freq, 120, 2000)} Hz for ${clamp(block.seconds, 0.1, 1)} seconds`;
  if (block.kind === "stop") return ["motor_a.stop()", "motor_b.stop()"].join("\n");
  if (block.kind === "repeat") {
    const times = Math.round(clamp(block.times, 2, 6));
    return [
      `for _ in range(${times}):`,
      `    motor_a.start(speed=30)`,
      `    time.sleep(0.5)`,
      `    motor_a.stop()`,
      `    time.sleep(0.2)`
    ].join("\n");
  }
  return "";
}

function generatePython() {
  const body = program.length ? program.map(lineFor).join("\n") : [
    "hub.led(6)",
    "motor_a.start(speed=30)",
    "time.sleep(1)",
    "motor_a.stop()",
    "hub.led(0)"
  ].join("\n");
  return [
    "# WeDo 2.0 Blocks",
    "# Target: WeDo 2.0 MicroPython hub module",
    "# Safe classroom defaults: low speed, short duration, stop motors.",
    "import hub",
    "import time",
    "",
    "motor_a = hub.port.A.motor",
    "motor_b = hub.port.B.motor",
    "",
    body,
    "",
    "motor_a.stop()",
    "motor_b.stop()"
  ].join("\n");
}

function runCode() {
  const code = generatePython();
  document.getElementById("statusMsg").textContent = "Program exported from blocks.";
  if (window.AndroidBridge && window.AndroidBridge.onRunCode) {
    window.AndroidBridge.onRunCode(code);
  }
}

function getCode() {
  return generatePython();
}

document.querySelectorAll(".block").forEach(button => {
  button.addEventListener("click", () => addBlock(button.dataset.kind));
});
document.getElementById("runBtn").addEventListener("click", runCode);
document.getElementById("clearBtn").addEventListener("click", () => {
  program.length = 0;
  render();
});

window.updateBlock = updateBlock;
window.removeBlock = removeBlock;
window.getCode = getCode;
window.generatePython = generatePython;
render();
</script>
</body>
</html>
